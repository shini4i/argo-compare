# Gitea values for the e2e lab: a minimal, ephemeral git backend. sqlite, no
# persistence, every HA subchart off — the cluster is rebuilt per run, so
# durability is a non-goal. Credentials are fixed throwaway lab values.
redis-cluster:
  enabled: false
redis:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false
postgresql-ha:
  enabled: false
postgresql:
  enabled: false

persistence:
  enabled: false

replicaCount: 1

gitea:
  config:
    database:
      DB_TYPE: sqlite3
  admin:
    username: gitea_admin
    password: gitea_admin_pw1
    email: admin@example.com

# NodePort so the host-side argo-compare can clone. The number must match the
# containerPort in kind-config.yaml.
service:
  http:
    type: NodePort
    nodePort: 30300
