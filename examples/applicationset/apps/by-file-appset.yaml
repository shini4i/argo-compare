# One Application per matching file, with that file's own contents as
# parameters: by-file/app1/config.yaml holds `app: app1`, so the template reads
# {{ .app }}. `**` recurses in a files pattern (it does not in a directories one).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: by-file
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/you/your-gitops-repo.git
        revision: HEAD
        files:
          - path: "by-file/**/config.yaml"
  template:
    metadata:
      name: 'file-{{ .app }}'
      namespace: argocd
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .app }}'
      source:
        repoURL: https://github.com/you/your-gitops-repo.git
        path: charts/addon
        targetRevision: main
        helm:
          releaseName: 'file-{{ .app }}'
          values: |
            app: {{ .app }}
            tier: {{ .tier }}
