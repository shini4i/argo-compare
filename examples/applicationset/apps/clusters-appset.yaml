# One Application per directory under clusters/. Both repoURL values name THIS
# repository, and both are placeholders: replace them with your own origin URL.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/you/your-gitops-repo.git
        revision: HEAD
        directories:
          - path: clusters/*
        # Rendered against the path parameters and exposed back as .values.*
        values:
          cluster: '{{ .path.basename }}'
  template:
    metadata:
      name: 'demo-{{ .path.basenameNormalized }}'
      namespace: argocd
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .values.cluster }}'
      source:
        repoURL: https://github.com/you/your-gitops-repo.git
        path: charts/demo
        targetRevision: main
        helm:
          releaseName: 'demo-{{ .path.basenameNormalized }}'
          values: |
            cluster: {{ .values.cluster }}
