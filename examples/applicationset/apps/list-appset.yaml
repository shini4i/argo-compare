# One Application per element, with the elements written out here. A list
# generator reads no tree at all, so editing this file is the only change that
# alters which Applications exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: list
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: app1
            tier: standard
          - app: app2
            tier: premium
  template:
    metadata:
      name: 'list-{{ .app }}'
      namespace: argocd
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .app }}'
      source:
        repoURL: https://github.com/you/your-gitops-repo.git
        path: charts/generated
        targetRevision: main
        helm:
          releaseName: 'list-{{ .app }}'
          values: |
            app: {{ .app }}
            tier: {{ .tier }}
